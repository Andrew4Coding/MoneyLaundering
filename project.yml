name: Money Laundering

options:
  bundleIdPrefix: com.andrew4coding.moneylaundering
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.5"

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: "92QV2QPDKA"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

schemes:
  Money Laundering:
    build:
      targets:
        "Money Laundering": all
        MoneyLaunderingShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Money Laundering Share Extension:
    build:
      targets:
        MoneyLaunderingShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  "Money Laundering":
    type: application
    platform: iOS
    sources:
      - path: "Money Laundering"
    info:
      path: "Money Laundering/Info.plist"
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.andrew4coding.moneylaundering.Money-Laundering
            CFBundleURLSchemes:
              - moneylaundering
    entitlements:
      path: "Money Laundering/Money Laundering.entitlements"
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.andrew4coding.moneylaundering.Money-Laundering
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.andrew4coding.moneylaundering.sharedData
    dependencies:
      - target: MoneyLaunderingShareExtension
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: "92QV2QPDKA"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of a bill to attach it to a transaction."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach a photo of a bill from your library to a transaction."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.moneylaundering.Money-Laundering
        PRODUCT_NAME: "$(TARGET_NAME)"
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  MoneyLaunderingShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: "MoneyLaunderingShareExtension"
    entitlements:
      path: "MoneyLaunderingShareExtension/MoneyLaunderingShareExtension.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.andrew4coding.moneylaundering.sharedData
    info:
      path: "MoneyLaunderingShareExtension/Info.plist"
      properties:
        CFBundleDisplayName: Money Laundering
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: "92QV2QPDKA"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.andrew4coding.moneylaundering.Money-Laundering.MoneyLaunderingShareExtension
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1,2"
